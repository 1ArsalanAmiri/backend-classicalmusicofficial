limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;
limit_req_zone $binary_remote_addr zone=addr_req_limit:10m rate=10r/s;


map $http_origin $cors_origin {
    default "";
    "https://clmusic.ir" $http_origin;
    "https://www.clmusic.ir" $http_origin;
}

# -----------------------------------------------------------------
# HTTP Server (Port 80)
# -----------------------------------------------------------------
server {
    listen 80;
    server_name clmusic.ir www.clmusic.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 80;
    server_name api.clmusic.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------
# HTTPS Server (Port 443)
# -----------------------------------------------------------------
server {
    listen 443 ssl;
    server_name clmusic.ir www.clmusic.ir;

    ssl_certificate /etc/letsencrypt/live/clmusic.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clmusic.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    server_tokens off;

    resolver 127.0.0.11 valid=10s;

    client_max_body_size 1200M;
    client_body_buffer_size 512k;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    location /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        log_not_found off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ^~ /media/tickets/ {
        deny all;
        return 403;
    }

    location ~* ^/media/.*\.(jpg|jpeg|png|gif|webp|svg|ico|m3u8|ts)$ {
        root /usr/share/nginx/html;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header 'Access-Control-Allow-Origin' '*' always;
        try_files $uri =404;
    }

    location /video-cdn/ {
        resolver 127.0.0.11 valid=30s;
        set $video_cdn_upstream "dl.clmusic.ir";
        proxy_pass https://$video_cdn_upstream/;
        proxy_set_header Host $video_cdn_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name $video_cdn_upstream;
        proxy_http_version 1.1;

        # Range requests (برای seek کردن HLS) رو بدون تغییر رد می‌کنیم
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_set_header Referer "";

        add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Content-Type, Origin' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, Accept-Ranges' always;
        add_header 'Vary' 'Origin' always;

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range, Content-Type, Origin' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # -----------------------------------------------------------------
    # Download ZIP - must come BEFORE the general API/backend regex.
    # -----------------------------------------------------------------
    location ~ ^/api/v1/albums/(.*)/download-zip/$ {
        limit_req zone=addr_req_limit burst=5 nodelay;
        client_max_body_size 500M;
        client_body_timeout 1800;

        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 1800;
        proxy_send_timeout 1800;
        proxy_read_timeout 1800;
    }

    location /protected-media/ {
        internal;
        alias /usr/share/nginx/html/media/;
        limit_conn addr_conn_limit 3;
        limit_rate 2m;

        add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Disposition' always;
        add_header 'Vary' 'Origin' always;
    }

    # -----------------------------------------------------------------
    # Django / Backend (با preflight/OPTIONS مدیریت‌شده توسط Nginx)
    # -----------------------------------------------------------------
    location ~ ^/(admin|_nested_admin|schema|swagger|accounts|profile|music|playlist|payments|videos|contacts|content|api|django-admin|health|__debug__|search)/ {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        limit_req zone=addr_req_limit burst=20 nodelay;
        client_body_timeout 1800;

        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 1800;
        proxy_send_timeout 1800;
        proxy_read_timeout 1800;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -----------------------------------------------------------------
# API HTTPS Server
# -----------------------------------------------------------------
server {
    listen 443 ssl;
    server_name api.clmusic.ir;

    ssl_certificate /etc/letsencrypt/live/api.clmusic.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.clmusic.ir/privkey.pem;

