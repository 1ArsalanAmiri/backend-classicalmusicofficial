{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block extrastyle %}
{{ block.super }}
<style>
    .upload-container { max-width: 700px; margin: 40px auto; background: #a65327; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .progress-wrapper { width: 100%; background-color: #a65327; border-radius: 5px; margin-top: 20px; overflow: hidden; display: none; }
    .progress-bar { height: 28px; background-color: #007bff; width: 0%; text-align: center; line-height: 28px; color: white; transition: width 0.2s ease; font-weight: bold; }
    .status-text { margin-top: 15px; font-weight: bold; color: #495057; font-size: 1.1em; }
    .error-box { margin-top: 15px; color: #721c24; background-color: #f8d7da; padding: 12px; border: 1px solid #f5c6cb; border-radius: 4px; display: none; white-space: pre-wrap; }
    .submit-row input.default { background-color: #417690; color: white; }
    #upload-form { display: block; }
</style>
{% endblock %}

{% block content %}
<div class="upload-container">
    <h2>آپلود گروهی ترک‌ها برای آلبوم: {{ album.title }}</h2>

    <!-- فرم آپلود -->
    <form id="upload-form" method="post" enctype="multipart/form-data" action="{% url 'admin:album_batch_upload' album.id %}">
        {% csrf_token %}
        <div style="margin: 20px 0;">
            <label for="archive_file">فایل فشرده (ZIP/RAR) را انتخاب کنید:</label><br><br>
            <input type="file" name="archive_file" id="archive_file" accept=".zip,.rar" required>
        </div>
        <div class="submit-row">
            <input type="submit" value="شروع آپلود و پردازش" class="default">
        </div>
    </form>

    <!-- نمایشگر پیشرفت -->
    <div id="progress-container" style="display: none;">
        <div class="progress-wrapper" id="progress-wrapper" style="display: block;">
            <div class="progress-bar" id="progress-bar">0%</div>
        </div>
        <div class="status-text" id="status-text">در حال آپلود فایل...</div>
        <div class="error-box" id="error-box"></div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const MAX_BYTES = 10 * 1024 * 1024 * 1024; // ۱۰ گیگابایت
    const MAX_POLL_FAILURES = 5;
    const STATUS_LABELS = {
        pending: 'در صف پردازش',
        extracting: 'در حال استخراج آرشیو',
        processing: 'در حال پردازش و آپلود ترک‌ها',
        completed: 'تکمیل شد',
        failed: 'ناموفق'
    };

    const uploadForm = document.getElementById('upload-form');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const statusText = document.getElementById('status-text');
    const errorBox = document.getElementById('error-box');
    const fileInput = document.getElementById('archive_file');

    let uploading = false;
    let lastLoaded = 0;

    // تا وقتی آپلود در جریان است، بستن/رفرش صفحه هشدار بدهد
    window.addEventListener('beforeunload', function(e) {
        if (uploading) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    // تابع برای گرفتن توکن CSRF از کوکی
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    const csrftoken = getCookie('csrftoken');

    function formatSize(bytes) {
        if (bytes >= 1024 * 1024 * 1024) return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    function describeHttpError(status) {
        if (status === 413) return 'خطای 413: حجم فایل از سقف مجاز سرور (nginx یا CDN) بیشتر است.';
        if (status === 403) return 'خطای 403: نشست یا توکن CSRF منقضی شده یا دسترسی ندارید. صفحه را رفرش کنید و دوباره وارد شوید.';
        if (status === 502 || status === 503 || status === 504) return 'خطای ' + status + ': سرور برنامه پاسخ نداد یا تایم‌اوت شد.';
        if (status === 500) return 'خطای 500: خطای داخلی سرور (لاگ backend و nginx را بررسی کنید).';
        return 'خطای سرور: ' + status;
    }

    uploadForm.addEventListener('submit', function(event) {
        event.preventDefault(); // جلوگیری از ارسال عادی فرم

        if (fileInput.files.length === 0) {
            alert('لطفا یک فایل را انتخاب کنید.');
            return;
        }

        const file = fileInput.files[0];
        const lowerName = file.name.toLowerCase();
        if (!lowerName.endsWith('.zip') && !lowerName.endsWith('.rar')) {
            alert('فقط فایل zip یا rar مجاز است.');
            return;
        }
        if (file.size > MAX_BYTES) {
            alert('حجم فایل (' + formatSize(file.size) + ') بیشتر از سقف مجاز ۱۰ گیگابایت است.');
            return;
        }

        const formData = new FormData(uploadForm);

        // مخفی کردن فرم و نمایش نوار پیشرفت
        uploadForm.style.display = 'none';
        progressContainer.style.display = 'block';

        const xhr = new XMLHttpRequest();
        xhr.open('POST', uploadForm.action, true);
        xhr.setRequestHeader('X-CSRFToken', csrftoken);
        xhr.timeout = 0; // بدون محدودیت زمانی سمت مرورگر

        uploading = true;
        lastLoaded = 0;

        // رویداد برای نمایش پیشرفت آپلود فایل به سرور
        xhr.upload.onprogress = function(e) {
            lastLoaded = e.loaded;
            if (e.lengthComputable) {
                const percentComplete = Math.round((e.loaded / e.total) * 100);
                progressBar.style.width = percentComplete + '%';
                progressBar.textContent = percentComplete + '%';
                statusText.textContent = 'در حال آپلود فایل به سرور... (' +
                    formatSize(e.loaded) + ' از ' + formatSize(e.total) + ')';
            }
        };

        // ارسال از سمت مرورگر تمام شد؛ سرور هنوز باید فایل را بگیرد و ذخیره کند
        xhr.upload.onload = function() {
            statusText.textContent = 'ارسال تمام شد؛ سرور در حال دریافت و ذخیره فایل است. ' +
                'برای فایل‌های بزرگ ممکن است چند دقیقه طول بکشد، صفحه را نبندید...';
        };

        // رویداد پس از دریافت پاسخ سرور
        xhr.onload = function() {
            uploading = false;

            let data = null;
            try {
                data = JSON.parse(xhr.responseText);
            } catch (e) {
                console.error('Response Parsing Error:', e, xhr.responseText);
            }

            if (xhr.status === 200 && data && data.success) {
                statusText.textContent = 'آپلود کامل شد. در انتظار پردازش...';
                progressBar.style.backgroundColor = '#ffc107';
                progressBar.style.width = '0%';
                progressBar.textContent = '0%';
                pollCeleryProgress(data.progress_url);
            } else if (data && data.error) {
                showError(data.error);
            } else if (xhr.status === 200) {
                showError('پاسخ نامعتبر از سرور (ممکن است سرور کرش کرده باشد).');
            } else {
                showError(describeHttpError(xhr.status));
                console.error('Server Error:', xhr.status, xhr.responseText);
            }
        };

        xhr.onerror = function() {
            uploading = false;
            showError(
                'اتصال وسط آپلود قطع شد (پس از ارسال ' + formatSize(lastLoaded) + ' از ' +
                formatSize(file.size) + ').\n' +
                'اگر این عدد تقریباً صفر است، معمولاً سرور/nginx/CDN درخواست را به‌دلیل سقف حجم یا پر بودن دیسک رد کرده؛ ' +
                'اگر وسط راه است، احتمالاً اینترنت شما قطع شده یا تایم‌اوت شده.\n' +
                'کد دقیق را در تب Network مرورگر (DevTools) ببینید.'
            );
        };

        xhr.send(formData);
    });

    function pollCeleryProgress(progressUrl) {
        let failures = 0;
        const interval = setInterval(() => {
            fetch(progressUrl, {credentials: 'same-origin'})
                .then(response => {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(data => {
                    failures = 0;
                    const status = String(data.status || '').toLowerCase();
                    const label = STATUS_LABELS[status] || data.status;

                    progressBar.style.backgroundColor = '#17a2b8'; // رنگ آبی برای پردازش
                    progressBar.style.width = data.progress + '%';
                    progressBar.textContent = data.progress + '%';
                    statusText.textContent = 'وضعیت پردازش: ' + label;

                    if (status === 'completed') {
                        clearInterval(interval);
                        progressBar.style.backgroundColor = '#28a745'; // سبز برای موفقیت
                        progressBar.style.width = '100%';
                        progressBar.textContent = '100%';
                        statusText.textContent = 'پردازش با موفقیت به پایان رسید!';
                        statusText.style.color = '#28a745';
                        if (data.error_log) {
                            errorBox.style.display = 'block';
                            errorBox.textContent = data.error_log; // هشدارهای جزئی
                        }
                    } else if (status === 'failed' || status === 'error') {
                        clearInterval(interval);
                        showError('خطا در پردازش فایل: ' + (data.error_log || ''));
                    }
                })
                .catch(err => {
                    // پردازش ممکن است ساعت‌ها طول بکشد؛ یک خطای گذرا نباید پیگیری را قطع کند
                    failures += 1;
                    console.error('Error fetching progress:', err);
                    if (failures >= MAX_POLL_FAILURES) {
                        clearInterval(interval);
                        showError('خطا در دریافت وضعیت پردازش. ارتباط با سرور قطع شده است؛ ' +
                                  'پردازش در پس‌زمینه ادامه دارد، بعداً رکورد آپلود را در ادمین بررسی کنید.');
                    }
                });
        }, 2000); // هر ۲ ثانیه
    }

    function showError(message) {
        uploading = false;
        progressBar.style.backgroundColor = '#dc3545'; // قرمز برای خطا
        statusText.textContent = 'عملیات ناموفق بود.';
        statusText.style.color = '#dc3545';
        errorBox.style.display = 'block';
        errorBox.textContent = message;
    }
});
</script>
{% endblock %}
